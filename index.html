<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Celestial Vanguard</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gowun+Batang&family=Gowun+Dodum&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@400;600;700&display=swap");

    :root {
      --bg: #070707;
      --panel: rgba(18, 16, 13, .86);
      --panel-strong: rgba(29, 25, 18, .94);
      --gold: #d7b45a;
      --gold-soft: #f4df9a;
      --text: #f8f1dc;
      --muted: #c8bfa9;
      --line: rgba(215, 180, 90, .34);
      --shadow: 0 24px 70px rgba(0, 0, 0, .55);
      --site-font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      --page-bg: radial-gradient(circle at 25% 8%, rgba(242, 218, 139, .12), transparent 28rem), radial-gradient(circle at 78% 20%, rgba(118, 139, 166, .12), transparent 28rem), linear-gradient(180deg, #050505 0%, #12100d 46%, #070707 100%);
      --grid-opacity: 1;
      --hero-fallback-bg: linear-gradient(115deg, rgba(0,0,0,.72), rgba(0,0,0,.08) 46%, rgba(0,0,0,.88)), radial-gradient(circle at 70% 26%, rgba(252, 232, 161, .24), transparent 15rem), radial-gradient(circle at 50% 8%, rgba(245, 245, 255, .13), transparent 23rem), linear-gradient(140deg, #080808, #1c1710 47%, #090909);
      --hero-overlay: linear-gradient(90deg, rgba(0,0,0,.86), rgba(0,0,0,.34) 52%, rgba(0,0,0,.78)), linear-gradient(0deg, rgba(5,5,5,.86), transparent 52%);
      --theme-art: url("assets/themes/celestial/hero-bg.png");
      --theme-art-opacity: .26;
      --theme-art-blend: screen;
      --hero-align: end start;
      --hero-content-width: 820px;
      --hero-text-align: left;
      --hero-content-offset: 0;
      --hero-title-weight: 700;
      --hero-title-spacing: 0;
      --hero-title-transform: none;
      --subtitle-color: #fff5d8;
      --card-bg: linear-gradient(180deg, var(--panel-strong), rgba(12, 11, 10, .92));
      --card-overlay: linear-gradient(135deg, rgba(244,223,154,.14), transparent 34%);
      --card-radius: 8px;
      --footer-bg: rgba(12, 10, 8, .82);
      --footer-heading: var(--gold-soft);
      --footer-text: var(--muted);
      --mark-bg: rgba(5,5,5,.42);
      --mark-transform: uppercase;
      --intro-bg: radial-gradient(circle at 50% 38%, rgba(255,255,255,.2), transparent 12rem), radial-gradient(circle at 50% 50%, rgba(215,180,90,.22), transparent 22rem), linear-gradient(140deg, #020202, #1a1510 48%, #050505);
    }

    body[data-theme="apple"] {
      --bg: #f5f5f7;
      --panel: #ffffff;
      --panel-strong: #ffffff;
      --gold: #0066cc;
      --gold-soft: #1d1d1f;
      --text: #1d1d1f;
      --muted: #333333;
      --line: rgba(0, 0, 0, .08);
      --shadow: rgba(0, 0, 0, .22) 3px 5px 30px 0;
      --page-bg: linear-gradient(180deg, #ffffff 0%, #f5f5f7 52%, #ffffff 100%);
      --grid-opacity: 0;
      --hero-fallback-bg: linear-gradient(180deg, rgba(255,255,255,.38), rgba(245,245,247,.86)), url("assets/themes/minimal-gallery/hero-bg.png");
      --hero-overlay: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.7));
      --theme-art: url("assets/themes/minimal-gallery/hero-bg.png");
      --theme-art-opacity: .2;
      --theme-art-blend: multiply;
      --hero-align: center;
      --hero-content-width: 980px;
      --hero-text-align: center;
      --hero-title-weight: 600;
      --hero-title-spacing: -0.02em;
      --subtitle-color: #1d1d1f;
      --card-bg: #ffffff;
      --card-overlay: none;
      --card-radius: 18px;
      --footer-bg: #f5f5f7;
      --footer-heading: #1d1d1f;
      --footer-text: #333333;
      --mark-bg: rgba(255,255,255,.78);
      --intro-bg: linear-gradient(180deg, #ffffff 0%, #f5f5f7 100%);
    }

    body[data-theme="bugatti"] {
      --bg: #000000;
      --panel: #0d0d0d;
      --panel-strong: #141414;
      --gold: #ffffff;
      --gold-soft: #ffffff;
      --text: #ffffff;
      --muted: #cccccc;
      --line: #262626;
      --shadow: none;
      --page-bg: #000000;
      --grid-opacity: 0;
      --hero-fallback-bg: linear-gradient(90deg, rgba(0,0,0,.62), rgba(0,0,0,.16), rgba(0,0,0,.74)), url("assets/themes/black-luxury/hero-bg.png");
      --hero-overlay: linear-gradient(90deg, rgba(0,0,0,.78), rgba(0,0,0,.22), rgba(0,0,0,.82));
      --theme-art: url("assets/themes/black-luxury/hero-bg.png");
      --theme-art-opacity: .32;
      --theme-art-blend: screen;
      --hero-title-weight: 400;
      --hero-title-spacing: .08em;
      --hero-title-transform: uppercase;
      --subtitle-color: #cccccc;
      --card-bg: #0d0d0d;
      --card-overlay: none;
      --card-radius: 0;
      --footer-bg: #000000;
      --footer-heading: #ffffff;
      --footer-text: #cccccc;
      --mark-bg: transparent;
      --mark-transform: uppercase;
      --intro-bg: #000000;
    }

    body[data-theme="notion"] {
      --bg: #ffffff;
      --panel: #ffffff;
      --panel-strong: #ffffff;
      --gold: #6c47ff;
      --gold-soft: #111111;
      --text: #111111;
      --muted: #4f4a45;
      --line: #dedbd6;
      --shadow: rgba(15, 15, 15, 0.20) 0px 24px 48px -8px;
      --page-bg: linear-gradient(180deg, #10162f 0 38%, #ffffff 38% 100%);
      --grid-opacity: 0;
      --hero-fallback-bg: linear-gradient(180deg, rgba(16,22,47,.24), rgba(16,22,47,.42)), url("assets/themes/color-workspace/hero-bg.png");
      --hero-overlay: linear-gradient(180deg, rgba(16,22,47,.12), rgba(16,22,47,.28));
      --theme-art: url("assets/themes/color-workspace/hero-bg.png");
      --theme-art-opacity: .25;
      --theme-art-blend: normal;
      --hero-align: center;
      --hero-content-width: 980px;
      --hero-text-align: center;
      --hero-title-weight: 600;
      --hero-title-spacing: -0.03em;
      --subtitle-color: #ffffff;
      --card-bg: #ffffff;
      --card-overlay: linear-gradient(135deg, rgba(255,214,107,.28), transparent 42%);
      --card-radius: 12px;
      --footer-bg: #fff2a8;
      --footer-heading: #111111;
      --footer-text: #4f4a45;
      --mark-bg: rgba(255,255,255,.12);
      --intro-bg: radial-gradient(circle at 28% 24%, rgba(255,214,107,.6), transparent 8rem), linear-gradient(180deg, #10162f, #182044);
    }

    body[data-theme="claude"] {
      --bg: #faf9f5;
      --panel: #efe9de;
      --panel-strong: #efe9de;
      --gold: #cc785c;
      --gold-soft: #141413;
      --text: #141413;
      --muted: #3d3d3a;
      --line: #e6dfd8;
      --shadow: 0 1px 3px rgba(20,20,19,.08);
      --page-bg: linear-gradient(180deg, #faf9f5, #f5f0e8);
      --grid-opacity: 0;
      --hero-fallback-bg: linear-gradient(90deg, rgba(250,249,245,.2), rgba(250,249,245,.72)), url("assets/themes/cream-editorial/hero-bg.png");
      --hero-overlay: linear-gradient(90deg, rgba(250,249,245,.08), rgba(250,249,245,.5));
      --theme-art: url("assets/themes/cream-editorial/hero-bg.png");
      --theme-art-opacity: .18;
      --theme-art-blend: multiply;
      --hero-title-weight: 400;
      --hero-title-spacing: -0.025em;
      --subtitle-color: #3d3d3a;
      --card-bg: #efe9de;
      --card-overlay: none;
      --card-radius: 12px;
      --footer-bg: #181715;
      --footer-heading: #faf9f5;
      --footer-text: #a09d96;
      --mark-bg: rgba(204,120,92,.08);
      --intro-bg: radial-gradient(circle at 50% 38%, rgba(204,120,92,.18), transparent 14rem), linear-gradient(180deg, #faf9f5, #efe9de);
    }

    body[data-theme="moonlight"] {
      --bg: #111528;
      --panel: rgba(25, 29, 52, .82);
      --panel-strong: rgba(32, 36, 65, .9);
      --gold: #d9cdf7;
      --gold-soft: #f2edff;
      --text: #f7f4ff;
      --muted: #cfc7e9;
      --line: rgba(221, 211, 255, .3);
      --shadow: 0 22px 58px rgba(22, 18, 48, .46);
      --page-bg: linear-gradient(180deg, #101529 0%, #17152d 50%, #101321 100%);
      --grid-opacity: .35;
      --hero-fallback-bg: linear-gradient(180deg, rgba(20,24,50,.18), rgba(12,14,31,.6)), url("assets/themes/moonlight-dream/hero-bg.png");
      --hero-overlay: linear-gradient(180deg, rgba(17,21,40,.12), rgba(17,21,40,.48)), linear-gradient(90deg, rgba(16,18,40,.46), rgba(16,18,40,.08), rgba(16,18,40,.56));
      --theme-art: url("assets/themes/moonlight-dream/hero-bg.png");
      --theme-art-opacity: .3;
      --theme-art-blend: screen;
      --hero-align: center;
      --hero-content-width: 920px;
      --hero-text-align: center;
      --hero-title-weight: 700;
      --hero-title-spacing: 0;
      --subtitle-color: #eee9ff;
      --card-bg: linear-gradient(180deg, rgba(43, 43, 78, .84), rgba(24, 27, 52, .88));
      --card-overlay: linear-gradient(135deg, rgba(255,255,255,.16), transparent 42%);
      --card-radius: 16px;
      --footer-bg: rgba(22, 21, 43, .84);
      --footer-heading: #f2edff;
      --footer-text: #cfc7e9;
      --mark-bg: rgba(255,255,255,.11);
      --mark-transform: none;
      --intro-bg: radial-gradient(circle at 50% 38%, rgba(235,230,255,.28), transparent 14rem), linear-gradient(180deg, #151a34, #0f1126);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { background: var(--bg); color: var(--text); }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--site-font);
      background: linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.22)), var(--theme-art) center top / cover fixed no-repeat, var(--page-bg);
      overflow-x: hidden;
    }

    body.intro-lock { overflow: hidden; }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.75), transparent 70%);
      opacity: var(--grid-opacity);
    }

    .site-shell { opacity: 0; transition: opacity .55s ease; }
    .site-shell.ready { opacity: 1; }

    .hero {
      position: relative;
      min-height: 76vh;
      display: grid;
      place-items: var(--hero-align);
      padding: clamp(4rem, 9vw, 7.5rem) clamp(1.25rem, 5vw, 5rem);
      isolation: isolate;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
    }

    .hero.image-only { min-height: 58vh; }

    .hero-media,
    .hero-fallback {
      position: absolute;
      inset: 0;
      z-index: -2;
    }

    .hero-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: saturate(.96) contrast(1.08);
    }

    .hero-fallback {
      background: var(--hero-fallback-bg);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background: var(--hero-overlay);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--theme-art) center / cover no-repeat;
      mix-blend-mode: var(--theme-art-blend);
      opacity: var(--theme-art-opacity);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      width: min(var(--hero-content-width), 100%);
      padding-bottom: clamp(1rem, 4vw, 3rem);
      text-align: var(--hero-text-align);
      transform: translateY(var(--hero-content-offset));
    }

    .title-dock {
      display: none;
      width: 100%;
      margin: 0;
      padding: clamp(1.8rem, 5vw, 4rem) 0 clamp(1.2rem, 4vw, 2.6rem);
      text-align: var(--hero-text-align);
    }

    .title-dock.active { display: block; }
    .title-dock .hero-content {
      width: min(var(--hero-content-width), 100%);
      padding-bottom: 0;
      transform: none;
    }

    .guild-mark {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      color: var(--gold-soft);
      text-transform: var(--mark-transform);
      letter-spacing: 0;
      font-size: .84rem;
      border: 1px solid var(--line);
      padding: .52rem .74rem;
      background: var(--mark-bg);
      box-shadow: inset 0 0 26px rgba(215,180,90,.08);
    }

    h1 {
      margin: 1rem 0 .75rem;
      font-family: var(--site-font);
      font-size: clamp(3rem, 10vw, 7.75rem);
      line-height: .92;
      font-weight: var(--hero-title-weight);
      letter-spacing: var(--hero-title-spacing);
      text-transform: var(--hero-title-transform);
      white-space: pre-line;
      text-shadow: 0 6px 30px rgba(0,0,0,.74), 0 0 24px rgba(215,180,90,.18);
    }

    .subtitle {
      max-width: 720px;
      margin: 0;
      color: var(--subtitle-color);
      font-size: clamp(1.08rem, 2.3vw, 1.45rem);
      line-height: 1.8;
      text-shadow: 0 4px 18px rgba(0,0,0,.78);
    }

    main {
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto;
      padding: clamp(2.5rem, 6vw, 5rem) 0;
      display: flex;
      flex-direction: column;
    }

    .articles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      gap: 1rem;
    }

    .article-card {
      position: relative;
      min-height: 240px;
      padding: 1.35rem;
      background: var(--card-bg);
      border: 1px solid var(--line);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.06);
      border-radius: var(--card-radius);
      overflow: hidden;
    }

    .article-card.full { grid-column: 1 / -1; }
    .article-card.half { grid-column: span 1; }

    .article-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: var(--card-overlay);
    }

    .article-head {
      display: flex;
      align-items: center;
      gap: .7rem;
      margin-bottom: 1rem;
      position: relative;
    }

    .article-head.no-emoji {
      justify-content: center;
      text-align: center;
    }

    .article-emoji {
      display: grid;
      place-items: center;
      width: 2.6rem;
      height: 2.6rem;
      border: 1px solid rgba(244,223,154,.38);
      background: rgba(255,255,255,.045);
      border-radius: 8px;
      font-size: 1.35rem;
    }

    h2 {
      margin: 0;
      color: var(--gold-soft);
      font-family: var(--site-font);
      font-size: 1.35rem;
      line-height: 1.25;
    }

    .article-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: .74rem;
      color: var(--muted);
      position: relative;
    }

    .article-list li {
      display: grid;
      grid-template-columns: 1.3rem 1fr;
      gap: .35rem;
      line-height: 1.75;
      overflow-wrap: anywhere;
    }

    .article-list.no-bullets li {
      grid-template-columns: 1fr;
    }

    .bullet { color: var(--gold); text-shadow: 0 0 12px rgba(215,180,90,.28); }
    .font-small { font-size: .94rem; }
    .font-medium { font-size: 1.03rem; }
    .font-large { font-size: 1.15rem; }

    .empty {
      grid-column: 1 / -1;
      padding: 2rem;
      border: 1px dashed var(--line);
      color: var(--muted);
      text-align: center;
    }

    .gallery-section {
      display: none;
      margin-top: clamp(2rem, 6vw, 4rem);
    }

    .gallery-section.active { display: block; }

    .gallery-section h2 {
      margin-bottom: 1rem;
      font-size: clamp(1.55rem, 4vw, 2.3rem);
    }

    .gallery-grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(var(--gallery-columns, 2), minmax(0, 1fr));
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      min-height: 180px;
      aspect-ratio: 16 / 10;
      border: 1px solid var(--line);
      border-radius: var(--card-radius);
      background: var(--card-bg);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .footer-cta {
      margin-top: clamp(2rem, 6vw, 4rem);
      padding: clamp(1.3rem, 4vw, 2.2rem);
      background: var(--footer-bg);
      border: 1px solid var(--line);
      border-left: 4px solid var(--gold);
      box-shadow: var(--shadow);
      border-radius: var(--card-radius);
    }

    .footer-cta h2 {
      color: var(--footer-heading);
      font-size: clamp(1.55rem, 4vw, 2.3rem);
    }
    .footer-cta p {
      margin: .85rem 0 0;
      color: var(--footer-text);
      line-height: 1.85;
      white-space: pre-wrap;
    }

    .footer-image {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      object-position: center;
      margin-top: 1rem;
      border: 1px solid var(--line);
      border-radius: var(--card-radius);
    }

    .status {
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--gold-soft);
      padding: 2rem;
      text-align: center;
    }

    .page-jump {
      position: fixed;
      right: clamp(.7rem, 2vw, 1.2rem);
      bottom: clamp(.7rem, 2vw, 1.2rem);
      z-index: 10;
      display: grid;
      gap: .5rem;
    }

    .page-jump button {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--gold-soft);
      background: rgba(0, 0, 0, .48);
      box-shadow: var(--shadow);
      cursor: pointer;
      font-size: 1.1rem;
      backdrop-filter: blur(10px);
    }

    .page-jump button:active { transform: scale(.96); }

    .intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: #030303;
      overflow: hidden;
    }

    .intro-overlay::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--intro-bg);
      transform: scale(1.04);
    }

    .intro-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.02);
      animation: introImage var(--intro-duration, 3000ms) ease-in-out forwards;
    }

    .intro-overlay::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,.82), transparent 44%, rgba(0,0,0,.72)),
        linear-gradient(0deg, rgba(0,0,0,.86), transparent 50%, rgba(0,0,0,.46));
    }

    .intro-title {
      position: relative;
      z-index: 1;
      width: min(720px, calc(100% - 2rem));
      text-align: center;
      white-space: pre-line;
      color: var(--gold-soft);
      font-family: var(--site-font);
      font-size: clamp(2.2rem, 8vw, 5.6rem);
      line-height: 1;
      text-shadow: 0 0 38px rgba(215,180,90,.28), 0 8px 40px rgba(0,0,0,.9);
      animation: introTitle var(--intro-duration, 3000ms) ease-in-out forwards;
    }

    .intro-overlay.hiding { animation: introFade .45s ease forwards; }

    @keyframes introImage {
      0% { opacity: 0; transform: scale(1.03); }
      22% { opacity: .88; }
      72% { opacity: .92; }
      100% { opacity: 0; transform: scale(1.09); }
    }

    @keyframes introTitle {
      0% { opacity: 0; transform: translateY(12px); }
      28%, 72% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-8px); }
    }

    @keyframes introFade { to { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

    @media (max-width: 680px) {
      .hero { min-height: 68vh; padding-inline: 1rem; }
      .guild-mark { font-size: .78rem; }
      main { width: min(100% - 1rem, 1180px); }
      .articles { grid-template-columns: 1fr !important; }
      .gallery-grid { grid-template-columns: 1fr !important; }
      .article-card { padding: 1rem; min-height: auto; }
    }
  </style>
</head>
<body>
  <div id="loading" class="status" hidden></div>
  <div id="app" class="site-shell" hidden>
    <header id="hero" class="hero"></header>
    <main>
      <section id="titleDock" class="title-dock"></section>
      <section id="articles" class="articles" aria-label="길드 소개 글"></section>
      <section id="gallery" class="gallery-section" aria-label="길드 갤러리"></section>
      <section id="footer" class="footer-cta"></section>
    </main>
    <div class="page-jump" aria-label="페이지 이동">
      <button type="button" id="scrollTopBtn" aria-label="페이지 맨 위로 이동">↑</button>
      <button type="button" id="scrollBottomBtn" aria-label="페이지 맨 아래로 이동">↓</button>
    </div>
  </div>

  <script>
    const FALLBACK_DATA = {
      site: { version: "1.0.0", updatedAt: "2026-01-01" },
      theme: { fontFamily: "system", preset: "celestial" },
      layout: { articleColumns: 2, sectionOrder: ["title", "articles", "gallery", "footer"] },
      hero: {
        title: "Celestial Vanguard",
        label: "MMORPG Guild Recruitment",
        contentPosition: "bottom",
        titleSize: "large",
        subtitle: "빛의 날개 아래, 함께 전장을 지배할 동료를 찾습니다.",
        image: "",
        imagePosition: "center center",
        imageAlt: "길드 대표 이미지"
      },
      intro: {
        enabled: true,
        image: "",
        imageAlt: "판타지 인트로 이미지",
        title: "",
        textAlign: "center",
        durationMs: 3000,
        useSessionSkip: true
      },
      articles: [
        {
          id: "article-1",
          emoji: "⚔️",
          title: "길드 소개",
          content: ["매일 접속하지 않아도 부담 없는 분위기", "신규, 복귀, 성장 유저 모두 환영", "함께 성장하는 길드 문화"],
          bulletStyle: "star",
          fontSize: "medium",
          width: "half"
        },
        {
          id: "article-2",
          emoji: "🛡️",
          title: "이런 분을 찾습니다",
          content: ["기본 매너를 지키는 분", "길드 콘텐츠에 관심 있는 분", "오래 함께할 커뮤니티를 찾는 분"],
          bulletStyle: "arrow",
          fontSize: "medium",
          width: "half"
        },
        {
          id: "article-3",
          emoji: "✨",
          title: "주요 활동",
          content: ["길드전", "협동 콘텐츠", "정보 공유", "이벤트 참여"],
          bulletStyle: "dot",
          fontSize: "medium",
          width: "half"
        }
      ],
      gallery: {
        enabled: false,
        title: "갤러리",
        columns: 2,
        images: []
      },
      footer: {
        title: "가입 및 문의",
        content: "게임 내 길드 검색 또는 운영진에게 문의해주세요.",
        image: "",
        imageAlt: "하단 안내 이미지"
      }
    };

    const bullets = { dot: "●", arrow: "▸", star: "✦", none: "" };
    const fontSizes = new Set(["small", "medium", "large"]);
    const articleColumns = new Set([1, 2]);
    const galleryColumns = new Set([1, 2, 3]);
    const sectionKeys = ["title", "articles", "gallery", "footer"];
    const fontMap = {
      system: '"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif',
      notoSans: '"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif',
      notoSerif: '"Noto Serif KR", "Nanum Myeongjo", Georgia, serif',
      nanumGothic: '"Nanum Gothic", "Noto Sans KR", "Malgun Gothic", sans-serif',
      nanumMyeongjo: '"Nanum Myeongjo", "Noto Serif KR", Georgia, serif',
      gowunDodum: '"Gowun Dodum", "Noto Sans KR", "Malgun Gothic", sans-serif',
      gowunBatang: '"Gowun Batang", "Noto Serif KR", Georgia, serif',
      doHyeon: '"Do Hyeon", "Noto Sans KR", "Malgun Gothic", sans-serif',
      blackHan: '"Black Han Sans", "Noto Sans KR", "Malgun Gothic", sans-serif',
      serif: 'Georgia, "Times New Roman", "Noto Serif KR", serif',
      clean: '"Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif',
      rounded: '"Arial Rounded MT Bold", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif'
    };
    const themePresets = new Set(["celestial", "apple", "bugatti", "notion", "claude", "moonlight"]);
    const imagePositions = new Set(["center top", "center 25%", "center center", "center 65%", "center bottom", "left center", "right center"]);
    const heroContentPositions = new Set(["default", "lower", "bottom"]);
    const heroTitleSizes = new Set(["small", "medium", "large", "xlarge"]);
    const heroTitleSizeMap = {
      small: "clamp(2.2rem, 6vw, 4.8rem)",
      medium: "clamp(2.7rem, 8vw, 6.2rem)",
      large: "clamp(3rem, 10vw, 7.75rem)",
      xlarge: "clamp(3.4rem, 12vw, 9rem)"
    };
    const introTextAligns = new Set(["left", "center", "right"]);

    function cleanText(value, fallback = "") {
      return typeof value === "string" ? value : fallback;
    }

    function normalizeSectionOrder(value, fallback) {
      const source = Array.isArray(value) ? value : fallback;
      const order = source.filter(key => sectionKeys.includes(key));
      sectionKeys.forEach(key => {
        if (!order.includes(key)) order.push(key);
      });
      return order;
    }

    function normalizeData(raw) {
      const data = raw && typeof raw === "object" ? raw : {};
      const fallback = FALLBACK_DATA;
      return {
        site: {
          version: cleanText(data.site?.version, fallback.site.version),
          updatedAt: cleanText(data.site?.updatedAt, fallback.site.updatedAt)
        },
        theme: {
          fontFamily: fontMap[data.theme?.fontFamily] ? data.theme.fontFamily : fallback.theme.fontFamily,
          preset: themePresets.has(data.theme?.preset) ? data.theme.preset : fallback.theme.preset
        },
        layout: {
          articleColumns: articleColumns.has(Number(data.layout?.articleColumns)) ? Number(data.layout.articleColumns) : fallback.layout.articleColumns,
          sectionOrder: normalizeSectionOrder(data.layout?.sectionOrder, fallback.layout.sectionOrder)
        },
        hero: {
          title: cleanText(data.hero?.title, fallback.hero.title),
          label: cleanText(data.hero?.label, fallback.hero.label),
          contentPosition: heroContentPositions.has(data.hero?.contentPosition) ? data.hero.contentPosition : fallback.hero.contentPosition,
          titleSize: heroTitleSizes.has(data.hero?.titleSize) ? data.hero.titleSize : fallback.hero.titleSize,
          subtitle: cleanText(data.hero?.subtitle, fallback.hero.subtitle),
          image: cleanText(data.hero?.image, ""),
          imagePosition: imagePositions.has(data.hero?.imagePosition) ? data.hero.imagePosition : fallback.hero.imagePosition,
          imageAlt: cleanText(data.hero?.imageAlt, fallback.hero.imageAlt)
        },
        intro: {
          enabled: typeof data.intro?.enabled === "boolean" ? data.intro.enabled : fallback.intro.enabled,
          image: cleanText(data.intro?.image, ""),
          imageAlt: cleanText(data.intro?.imageAlt, fallback.intro.imageAlt),
          title: cleanText(data.intro?.title, fallback.intro.title),
          textAlign: introTextAligns.has(data.intro?.textAlign) ? data.intro.textAlign : fallback.intro.textAlign,
          durationMs: Math.min(Math.max(Number(data.intro?.durationMs) || fallback.intro.durationMs, 400), 10000),
          useSessionSkip: typeof data.intro?.useSessionSkip === "boolean" ? data.intro.useSessionSkip : fallback.intro.useSessionSkip
        },
        articles: Array.isArray(data.articles) ? data.articles.map((item, index) => ({
          id: cleanText(item?.id, `article-${index + 1}`),
          emoji: cleanText(item?.emoji, ""),
          title: cleanText(item?.title, "제목 없음"),
          content: Array.isArray(item?.content) ? item.content.filter(line => typeof line === "string" && line.trim()).map(line => line.trim()) : [],
          bulletStyle: Object.hasOwn(bullets, item?.bulletStyle) ? item.bulletStyle : "star",
          fontSize: fontSizes.has(item?.fontSize) ? item.fontSize : "medium",
          width: item?.width === "full" || Number(data.layout?.articleColumns) === 1 ? "full" : "half"
        })) : fallback.articles,
        gallery: {
          enabled: typeof data.gallery?.enabled === "boolean" ? data.gallery.enabled : fallback.gallery.enabled,
          title: cleanText(data.gallery?.title, fallback.gallery.title),
          columns: galleryColumns.has(Number(data.gallery?.columns)) ? Number(data.gallery.columns) : fallback.gallery.columns,
          images: Array.isArray(data.gallery?.images) ? data.gallery.images.map((item, index) => ({
            id: cleanText(item?.id, `gallery-${index + 1}`),
            src: cleanText(item?.src, ""),
            alt: cleanText(item?.alt, "갤러리 이미지")
          })).filter(item => item.src) : []
        },
        footer: {
          title: cleanText(data.footer?.title, fallback.footer.title),
          content: cleanText(data.footer?.content, fallback.footer.content),
          image: cleanText(data.footer?.image, ""),
          imageAlt: cleanText(data.footer?.imageAlt, fallback.footer.imageAlt)
        }
      };
    }

    function applyTheme(theme) {
      document.documentElement.style.setProperty("--site-font", fontMap[theme.fontFamily] || fontMap.system);
      document.body.dataset.theme = theme.preset || "celestial";
    }

    function addImage(parent, src, alt, className, fallbackClass, imagePosition = "center center") {
      const fallback = document.createElement("div");
      fallback.className = fallbackClass;
      parent.append(fallback);
      if (!src) return;
      const img = document.createElement("img");
      img.className = className;
      img.alt = alt || "";
      img.src = src;
      img.style.objectPosition = imagePosition;
      img.onerror = () => img.remove();
      parent.append(img);
    }

    function renderHero(hero) {
      const root = document.getElementById("hero");
      const dock = document.getElementById("titleDock");
      root.textContent = "";
      dock.textContent = "";
      dock.classList.remove("active");
      addImage(root, hero.image, hero.imageAlt, "hero-media", "hero-fallback", hero.imagePosition);
      const content = document.createElement("div");
      content.className = "hero-content";
      const offsets = { default: "0", lower: "clamp(2rem, 8vh, 5rem)", bottom: "clamp(4rem, 14vh, 9rem)" };
      content.style.setProperty("--hero-content-offset", offsets[hero.contentPosition] || offsets.default);
      const mark = document.createElement("div");
      mark.className = "guild-mark";
      mark.textContent = hero.label;
      const title = document.createElement("h1");
      title.textContent = hero.title;
      title.style.fontSize = heroTitleSizeMap[hero.titleSize] || heroTitleSizeMap.large;
      const subtitle = document.createElement("p");
      subtitle.className = "subtitle";
      subtitle.textContent = hero.subtitle;
      content.append(mark, title, subtitle);
      if (hero.contentPosition === "bottom") {
        root.classList.add("image-only");
        dock.classList.add("active");
        dock.append(content);
      } else {
        root.classList.remove("image-only");
        root.append(content);
      }
      document.title = hero.title || "Guild Recruitment";
    }

    function renderArticles(articles, layout) {
      const root = document.getElementById("articles");
      root.textContent = "";
      root.style.gridTemplateColumns = "repeat(2, minmax(0, 1fr))";
      if (!articles.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "아직 등록된 홍보 글이 없습니다.";
        root.append(empty);
        return;
      }
      articles.forEach(article => {
        const card = document.createElement("article");
        card.className = `article-card ${article.width === "full" ? "full" : "half"}`;
        const head = document.createElement("div");
        head.className = "article-head";
        const hasEmoji = Boolean(article.emoji && article.emoji.trim());
        if (!hasEmoji) head.classList.add("no-emoji");
        const emoji = document.createElement("div");
        emoji.className = "article-emoji";
        emoji.textContent = article.emoji;
        const title = document.createElement("h2");
        title.textContent = article.title || "제목 없음";
        if (hasEmoji) head.append(emoji);
        head.append(title);
        const list = document.createElement("ul");
        list.className = `article-list font-${article.fontSize}`;
        if (article.bulletStyle === "none") list.classList.add("no-bullets");
        article.content.forEach(line => {
          const li = document.createElement("li");
          const text = document.createElement("span");
          text.textContent = line;
          if (article.bulletStyle !== "none") {
            const bullet = document.createElement("span");
            bullet.className = "bullet";
            bullet.textContent = bullets[article.bulletStyle] || bullets.star;
            li.append(bullet);
          }
          li.append(text);
          list.append(li);
        });
        card.append(head, list);
        root.append(card);
      });
    }

    function renderGallery(gallery) {
      const root = document.getElementById("gallery");
      root.textContent = "";
      root.classList.toggle("active", gallery.enabled && gallery.images.length > 0);
      if (!gallery.enabled || !gallery.images.length) return;

      const title = document.createElement("h2");
      title.textContent = gallery.title || "갤러리";
      const grid = document.createElement("div");
      grid.className = "gallery-grid";
      grid.style.setProperty("--gallery-columns", String(gallery.columns));

      gallery.images.forEach(item => {
        const figure = document.createElement("figure");
        figure.className = "gallery-item";
        const img = document.createElement("img");
        img.src = item.src;
        img.alt = item.alt || "";
        img.onerror = () => figure.remove();
        figure.append(img);
        grid.append(figure);
      });

      root.append(title, grid);
    }

    function renderFooter(footer) {
      const root = document.getElementById("footer");
      root.textContent = "";
      const title = document.createElement("h2");
      title.textContent = footer.title;
      const body = document.createElement("p");
      body.textContent = footer.content;
      root.append(title, body);
      if (footer.image) {
        const img = document.createElement("img");
        img.className = "footer-image";
        img.src = footer.image;
        img.alt = footer.imageAlt || "";
        img.onerror = () => img.remove();
        root.append(img);
      }
    }

    function applySectionOrder(order) {
      const targets = {
        title: document.getElementById("titleDock"),
        articles: document.getElementById("articles"),
        gallery: document.getElementById("gallery"),
        footer: document.getElementById("footer")
      };
      normalizeSectionOrder(order, FALLBACK_DATA.layout.sectionOrder).forEach((key, index) => {
        if (targets[key]) targets[key].style.order = String(index + 1);
      });
    }

    function showIntro(intro) {
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const key = "guild-intro-seen";
      const navigationType = performance.getEntriesByType("navigation")[0]?.type;
      const isReload = navigationType === "reload";
      if (!intro.enabled || (intro.useSessionSkip && !isReload && sessionStorage.getItem(key) === "yes")) return Promise.resolve();
      document.body.classList.add("intro-lock");
      const overlay = document.createElement("div");
      overlay.className = "intro-overlay";
      overlay.style.setProperty("--intro-duration", `${reduced ? 500 : intro.durationMs}ms`);
      if (intro.image) {
        const img = document.createElement("img");
        img.className = "intro-image";
        img.alt = intro.imageAlt || "";
        img.src = intro.image;
        img.onerror = () => img.remove();
        overlay.append(img);
      }
      if (intro.title.trim()) {
        const name = document.createElement("div");
        name.className = "intro-title";
        name.textContent = intro.title;
        name.style.textAlign = intro.textAlign;
        overlay.append(name);
      }
      document.body.append(overlay);
      const duration = reduced ? 500 : intro.durationMs;
      return new Promise(resolve => {
        window.setTimeout(() => {
          overlay.classList.add("hiding");
          window.setTimeout(() => {
            overlay.remove();
            document.body.classList.remove("intro-lock");
            if (intro.useSessionSkip) sessionStorage.setItem(key, "yes");
            resolve();
          }, reduced ? 20 : 460);
        }, duration);
      });
    }

    async function loadData() {
      try {
        const response = await fetch("./data.json", { cache: "no-store" });
        if (!response.ok) throw new Error("data.json fetch failed");
        return normalizeData(await response.json());
      } catch (error) {
        console.warn("data.json을 읽지 못해 기본 데이터를 표시합니다.", error);
        return normalizeData(FALLBACK_DATA);
      }
    }

    (async function init() {
      const data = await loadData();
      applyTheme(data.theme);
      renderHero(data.hero);
      renderArticles(data.articles, data.layout);
      renderGallery(data.gallery);
      renderFooter(data.footer);
      applySectionOrder(data.layout.sectionOrder);
      document.getElementById("loading").remove();
      const app = document.getElementById("app");
      app.hidden = false;
      await showIntro(data.intro);
      app.classList.add("ready");
    })();

    document.getElementById("scrollTopBtn").addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.getElementById("scrollBottomBtn").addEventListener("click", () => {
      window.scrollTo({ top: document.documentElement.scrollHeight, behavior: "smooth" });
    });
  </script>
</body>
</html>
